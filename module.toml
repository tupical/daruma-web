[module]
name         = "daruma-web"
kind         = "client"
status       = "shipped"
owner        = "clients"
contract     = "/v1/* + WS"
contract_min = "v1"
repo_path    = "daruma-web (standalone repo)"
runtime      = "Rust/WASM (Leptos 0.7, csr)"
read_only    = false  # project settings toggles PATCH /v1/projects/{id}/settings

[core]
source       = "git"
repo         = "https://github.com/tupical/daruma"
version      = "0.1.0"
tag          = "daruma-v0.1.0"
dev_override = "vendor/oss -> ../daruma"

[capabilities]
needs = [
  "TaskRead",
  "CommentRead",
  "ProjectRead",
  "PlanRead",
  "RunRead",
  "EventRead",
  "WsConnect",
  "DocumentRead",
  "TaskRelationRead",
]
# Only the project settings toggles need it; without it they revert with
# "Not authorized" and the rest of the viewer keeps working.
optional = ["ProjectWrite"]

[build]
tool    = "trunk"
profile = "release"
out_dir = "dist"

[serve]
# Standalone repo: the OSS server no longer serves this UI. The dist/ bundle is
# deployed behind any static host and points at the API server's /v1/* + /v1/ws.
mode    = "static"
mount   = "any static host"
